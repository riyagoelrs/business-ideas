name: Refresh restaurant hype data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/restaurant-hype-refresh.yml"
      - "restaurant-hype-map/pipeline/**"
      - "restaurant-hype-map/requirements-data.txt"

concurrency:
  group: restaurant-hype-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out business-ideas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select city batch
        run: |
          python - <<'PY'
          import datetime, os
          cities = [
            "New York, NY","Los Angeles, CA","Chicago, IL","Houston, TX","Phoenix, AZ",
            "Philadelphia, PA","San Antonio, TX","San Diego, CA","Dallas, TX","San Jose, CA",
            "Austin, TX","Jacksonville, FL","Fort Worth, TX","Columbus, OH","Indianapolis, IN",
            "Charlotte, NC","San Francisco, CA","Seattle, WA","Denver, CO","Washington, DC",
            "Nashville, TN","Oklahoma City, OK","El Paso, TX","Boston, MA","Portland, OR",
            "Las Vegas, NV","Detroit, MI","Memphis, TN","Louisville, KY","Baltimore, MD",
            "Milwaukee, WI","Albuquerque, NM","Tucson, AZ","Fresno, CA","Sacramento, CA",
            "Kansas City, MO","Atlanta, GA","Miami, FL","New Orleans, LA","Cleveland, OH",
            "Pittsburgh, PA"
          ]
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              batch = ["New York, NY"]
          else:
              idx = datetime.datetime.utcnow().timetuple().tm_yday % 6
              batch = cities[idx::6]
              if "New York, NY" not in batch:
                  batch = ["New York, NY"] + batch
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("HYPE_CITIES=" + "|".join(batch) + "\n")
          print("City batch:", " | ".join(batch))
          PY

      - name: Install free data dependencies
        run: pip install -r restaurant-hype-map/requirements-data.txt

      - name: Apply v9.1 clickable color-rated frontend
        run: python restaurant-hype-map/pipeline/apply_v9_frontend.py

      - name: Refresh restaurant universe from true city boundaries
        working-directory: restaurant-hype-map/pipeline
        env:
          HYPE_CITIES: ${{ env.HYPE_CITIES }}
        run: python refresh_city_boundaries.py

      - name: Commit restaurant app and data to main safely
        run: |
          git config user.name "restaurant-hype-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- restaurant-hype-map/data restaurant-hype-map/index.html)" ]; then
            git add restaurant-hype-map/data restaurant-hype-map/index.html
            git commit -m "Refresh restaurant data and v9.1 interactions"
            git pull --rebase origin main
            git push origin main
          else
            echo "No restaurant app/data changes"
          fi

      - name: Publish restaurant app and data to GitHub Pages
        run: |
          mkdir -p /tmp/hype-publish/data
          cp -R restaurant-hype-map/data/. /tmp/hype-publish/data/
          cp restaurant-hype-map/index.html /tmp/hype-publish/index.html
          cp restaurant-hype-map/v9-1-overlay.js /tmp/hype-publish/v9-1-overlay.js
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p restaurant-hype-map/data
          cp -R /tmp/hype-publish/data/. restaurant-hype-map/data/
          cp /tmp/hype-publish/index.html restaurant-hype-map/index.html
          cp /tmp/hype-publish/v9-1-overlay.js restaurant-hype-map/v9-1-overlay.js
          if [ -n "$(git status --porcelain -- restaurant-hype-map/data restaurant-hype-map/index.html restaurant-hype-map/v9-1-overlay.js)" ]; then
            git add restaurant-hype-map/data restaurant-hype-map/index.html restaurant-hype-map/v9-1-overlay.js
            git commit -m "Publish color-rated clickable restaurant map v9.1"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          else
            echo "No Pages restaurant changes"
          fi
