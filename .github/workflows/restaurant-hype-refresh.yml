name: Refresh restaurant hype data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/restaurant-hype-refresh.yml"
      - "restaurant-hype-map/pipeline/**"
      - "restaurant-hype-map/requirements-data.txt"

concurrency:
  group: restaurant-hype-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out business-ideas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out TikTok scraper
        uses: actions/checkout@v4
        with:
          repository: riyagoelrs/tiktok-scraper
          path: _tiktok

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free data dependencies
        run: |
          pip install -r restaurant-hype-map/requirements-data.txt
          pip install TikTokApi
          python -m playwright install --with-deps chromium

      - name: Collect public TikTok restaurant signals
        continue-on-error: true
        env:
          TIKTOK_HEADLESS: "1"
          TIKTOK_MS_TOKEN: ${{ secrets.TIKTOK_MS_TOKEN }}
        run: |
          mkdir -p restaurant-hype-map/data/tiktok
          python _tiktok/tiktok_scraper.py --mode search --query "nyc restaurants" --count 80 --out restaurant-hype-map/data/tiktok/nyc_restaurants.json || true
          python _tiktok/tiktok_scraper.py --mode search --query "nyc food" --count 80 --out restaurant-hype-map/data/tiktok/nyc_food.json || true
          python _tiktok/tiktok_scraper.py --mode search --query "new york restaurants" --count 80 --out restaurant-hype-map/data/tiktok/new_york_restaurants.json || true

      - name: Refresh zero-cost source snapshots and scores
        working-directory: restaurant-hype-map/pipeline
        run: python refresh_scores.py

      - name: Commit refreshed snapshot to main
        run: |
          git config user.name "restaurant-hype-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- restaurant-hype-map/data; then
            git add restaurant-hype-map/data
            git commit -m "Refresh free restaurant hype data"
            git push origin main
          else
            echo "No main-branch data changes"
          fi

      - name: Publish data snapshot to GitHub Pages branch
        run: |
          mkdir -p /tmp/hype-data
          cp -R restaurant-hype-map/data/. /tmp/hype-data/
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p restaurant-hype-map/data
          cp -R /tmp/hype-data/. restaurant-hype-map/data/
          if ! git diff --quiet -- restaurant-hype-map/data; then
            git add restaurant-hype-map/data
            git commit -m "Publish refreshed free restaurant hype data"
            git push origin gh-pages
          else
            echo "No Pages data changes"
          fi
