name: Refresh restaurant hype data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/restaurant-hype-refresh.yml"
      - "restaurant-hype-map/pipeline/**"
      - "restaurant-hype-map/requirements-data.txt"

concurrency:
  group: restaurant-hype-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out business-ideas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select city batch
        run: |
          python - <<'PY'
          import datetime, os
          cities = [
            "New York, NY","Los Angeles, CA","Chicago, IL","Houston, TX","Phoenix, AZ",
            "Philadelphia, PA","San Antonio, TX","San Diego, CA","Dallas, TX","San Jose, CA",
            "Austin, TX","Jacksonville, FL","Fort Worth, TX","Columbus, OH","Indianapolis, IN",
            "Charlotte, NC","San Francisco, CA","Seattle, WA","Denver, CO","Washington, DC",
            "Nashville, TN","Oklahoma City, OK","El Paso, TX","Boston, MA","Portland, OR",
            "Las Vegas, NV","Detroit, MI","Memphis, TN","Louisville, KY","Baltimore, MD",
            "Milwaukee, WI","Albuquerque, NM","Tucson, AZ","Fresno, CA","Sacramento, CA",
            "Kansas City, MO","Atlanta, GA","Miami, FL","New Orleans, LA","Cleveland, OH",
            "Pittsburgh, PA"
          ]
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              batch = [
                "New York, NY","Los Angeles, CA","Chicago, IL","San Francisco, CA",
                "Miami, FL","Austin, TX","Boston, MA","Atlanta, GA"
              ]
          else:
              batches = 6
              idx = datetime.datetime.utcnow().timetuple().tm_yday % batches
              batch = cities[idx::batches]
              if "New York, NY" not in batch:
                  batch = ["New York, NY"] + batch
          value = "|".join(batch)
          print("City batch:", value)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("HYPE_CITIES=" + value + "\n")
          PY

      - name: Install free data dependencies
        run: pip install -r restaurant-hype-map/requirements-data.txt

      - name: Collect TikTok signals when a session token is configured
        if: ${{ secrets.TIKTOK_MS_TOKEN != '' }}
        continue-on-error: true
        env:
          TIKTOK_HEADLESS: "1"
          TIKTOK_MS_TOKEN: ${{ secrets.TIKTOK_MS_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/riyagoelrs/tiktok-scraper.git _tiktok
          pip install TikTokApi
          python -m playwright install --with-deps chromium
          mkdir -p restaurant-hype-map/data/tiktok
          python - <<'PY'
          import os, re, subprocess
          cities = [x for x in os.environ.get("HYPE_CITIES", "").split("|") if x]
          special = {"New York":"nycfood","Los Angeles":"lafood","San Francisco":"sffood","Washington":"dcfood"}
          for city in cities:
              name = city.split(',')[0]
              slug = re.sub(r"[^a-z0-9]+", "_", city.lower()).strip("_")
              hashtag = special.get(name) or (re.sub(r"[^a-z0-9]+", "", name.lower()) + "food")
              subprocess.run(["python","_tiktok/tiktok_scraper.py","--mode","hashtag","--query",hashtag,"--count","28","--out",f"restaurant-hype-map/data/tiktok/{slug}.json"], check=False)
          PY

      - name: Refresh zero-cost source snapshots and scores
        working-directory: restaurant-hype-map/pipeline
        env:
          HYPE_CITIES: ${{ env.HYPE_CITIES }}
        run: python refresh_scores.py

      - name: Commit refreshed snapshot to main
        run: |
          git config user.name "restaurant-hype-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- restaurant-hype-map/data)" ]; then
            git add restaurant-hype-map/data
            git commit -m "Refresh free multi-city restaurant hype data"
            git pull --rebase origin main
            git push origin main
          else
            echo "No main-branch data changes"
          fi

      - name: Publish data snapshot to GitHub Pages branch
        run: |
          mkdir -p /tmp/hype-data
          cp -R restaurant-hype-map/data/. /tmp/hype-data/
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p restaurant-hype-map/data
          cp -R /tmp/hype-data/. restaurant-hype-map/data/
          if [ -n "$(git status --porcelain -- restaurant-hype-map/data)" ]; then
            git add restaurant-hype-map/data
            git commit -m "Publish refreshed free multi-city hype data"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          else
            echo "No Pages data changes"
          fi
