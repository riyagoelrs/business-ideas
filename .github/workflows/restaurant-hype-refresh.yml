name: Refresh restaurant hype data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data dependencies
        run: pip install -r restaurant-hype-map/requirements-data.txt

      - name: Refresh source snapshots and scores
        working-directory: restaurant-hype-map/pipeline
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python refresh_scores.py

      - name: Commit refreshed snapshot to main
        run: |
          git config user.name "restaurant-hype-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- restaurant-hype-map/data; then
            git add restaurant-hype-map/data
            git commit -m "Refresh restaurant hype data"
            git push origin main
          else
            echo "No main-branch data changes"
          fi

      - name: Publish data snapshot to GitHub Pages branch
        run: |
          mkdir -p /tmp/hype-data
          cp -R restaurant-hype-map/data/. /tmp/hype-data/
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p restaurant-hype-map/data
          cp -R /tmp/hype-data/. restaurant-hype-map/data/
          if ! git diff --quiet -- restaurant-hype-map/data; then
            git add restaurant-hype-map/data
            git commit -m "Publish refreshed restaurant hype data"
            git push origin gh-pages
          else
            echo "No Pages data changes"
          fi
